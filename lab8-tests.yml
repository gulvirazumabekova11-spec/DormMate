name: DormMate Lab 8 - Tests and Security
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project + Lab8 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install locust bandit
      - name: Run existing and new tests
        run: python -m pytest -v --junitxml=pytest-results.xml
      - name: Bandit static security analysis
        run: python -m bandit -r app -f txt -o bandit-report.txt || true
      - name: Upload test and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dormmate-lab8-reports
          path: |
            pytest-results.xml
            bandit-report.txt
          if-no-files-found: ignore
